name: Deploy to docs.lklcloud.fr

on:
  push:
    branches: [prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy build/ to production
        run: |
          cd build
          git init -q -b main
          git -c user.email="ci@lklcloud.fr" -c user.name="GitHub Actions" add -A
          git -c user.email="ci@lklcloud.fr" -c user.name="GitHub Actions" commit -q -m "deploy ${{ github.sha }}" --allow-empty
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            git push --force ssh://deploy-ci@83.150.218.32/home/deploy/lkl-documentation.git main

      # Même vérification que sur l'espace client : compare le fichier
      # index attendu (celui que CE build vient de produire) à celui que le
      # site sert vraiment, avec plusieurs essais pour absorber le délai
      # normal du hook côté serveur.
      - name: Vérifie que le déploiement a vraiment pris effet
        run: |
          EXPECTED=$(grep -oE 'assets/js/main\.[^"]*\.js' build/index.html | head -1)
          if [ -z "$EXPECTED" ]; then
            echo "::error::Impossible de déterminer le fichier JS attendu depuis le build qui vient d'être produit"
            exit 1
          fi
          LIVE=""
          for i in 1 2 3 4 5 6; do
            sleep 5
            LIVE=$(curl -s https://docs.lklcloud.fr/ | grep -oE 'assets/js/main\.[^"]*\.js' | head -1)
            if [ "$LIVE" = "$EXPECTED" ]; then
              CONTENT_TYPE=$(curl -s -o /dev/null -w "%{content_type}" "https://docs.lklcloud.fr/$LIVE")
              echo "OK : le site sert bien $LIVE (content-type $CONTENT_TYPE) après $i tentative(s)"
              if [[ "$CONTENT_TYPE" != *"javascript"* ]]; then
                echo "::error::$LIVE est le bon fichier mais renvoie '$CONTENT_TYPE' au lieu de JavaScript"
                exit 1
              fi
              exit 0
            fi
            echo "Tentative $i/6 : le site sert '$LIVE', attendu '$EXPECTED' — nouvel essai dans 5s..."
          done
          echo "::error::Après plusieurs essais, le site sert toujours '$LIVE' au lieu de '$EXPECTED' — le déploiement n'a pas pris effet côté serveur."
          exit 1

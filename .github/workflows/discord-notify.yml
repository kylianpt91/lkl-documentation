name: Discord notify
on:
  push:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "prod" ]; then
            COLOR=16738864
            LABEL="🟠 Production"
          else
            COLOR=5793266
            LABEL="🔵 Pré Production"
          fi
          # Un commit dont le sujet commence par 🔒 est volontairement masqué
          # ici (ex. détails d'une faille de sécurité tant que le correctif
          # n'est pas confirmé en prod) : le reste des commits s'affiche
          # normalement, cette convention doit rester rare.
          #
          # Discord refuse tout embed dont un champ dépasse 1024 caractères
          # (rejet silencieux : curl seul ne le voit pas, il faut vérifier la
          # réponse — déjà arrivé avec plusieurs commits groupés en un push).
          # On limite donc à 6 commits affichés, chaque sujet tronqué à 70
          # caractères, avec un total qui reste large sous la limite.
          COMMITS=$(jq -r '
            (.commits | length) as $total
            | [.commits[:6][] | (.message | split("\n")[0]) as $subject |
                ($subject | if length > 70 then .[0:70] + "…" else . end) as $short |
                if ($subject | startswith("🔒")) then
                  "• `\(.id[0:7])` **⚠️ À noter : non affiché ici pour raisons de sécurité** — \(.author.name)"
                else
                  "• `\(.id[0:7])` \($short) — \(.author.name)"
                end
              ] as $lines
            | (if $total > 6 then ($lines + ["… et " + ($total - 6 | tostring) + " commit(s) de plus"]) else $lines end)
            | join("\n")
          ' "$GITHUB_EVENT_PATH")
          N=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          PAYLOAD=$(jq -n \
            --arg username "Github Update APP" \
            --arg avatar "https://clients.lklcloud.fr/logo.png" \
            --arg title "🚀 Push on ${GITHUB_REPOSITORY}" \
            --arg branch "$BRANCH" \
            --arg label "$LABEL" \
            --argjson color "$COLOR" \
            --arg commits "$COMMITS" \
            --arg countLabel "📝 Commits ($N)" \
            '{ username: $username, avatar_url: $avatar, embeds: [{ title: $title, color: $color, fields: [
              { name: "🌿 Branch", value: $label },
              { name: $countLabel, value: $commits }
            ] }] }')
          HTTP_CODE=$(curl -s -o /tmp/discord_response.json -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK")
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord a refusé le message (HTTP $HTTP_CODE) : $(cat /tmp/discord_response.json)"
            exit 1
          fi
          echo "Notification envoyée avec succès (HTTP $HTTP_CODE)"

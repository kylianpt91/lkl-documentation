name: Discord notify
on:
  push:
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          # Le libellé suit la partie RÉELLEMENT modifiée (fichiers touchés par
          # le push) : contenu des fiches (docs/) vs technique du site de doc
          # (config, thème, workflows...), pas juste "Documentation" pour tout.
          ALL_FILES=$(jq -r '[.commits[] | (.added // []) + (.removed // []) + (.modified // [])] | flatten | unique | .[]' "$GITHUB_EVENT_PATH")
          TAGS=""
          if echo "$ALL_FILES" | grep -q '^docs/'; then
            TAGS="📖 Fiches de documentation"
          fi
          if echo "$ALL_FILES" | grep -qv '^docs/'; then
            [ -n "$TAGS" ] && TAGS="$TAGS + "
            TAGS="${TAGS}⚙️ Documentation (technique)"
          fi
          PROJECT="${TAGS:-📚 Documentation}"
          if [ "$BRANCH" = "prod" ]; then
            COLOR=16738864
            LABEL="🟠 Production"
          else
            COLOR=5793266
            LABEL="🔵 Pré Production"
          fi
          # Un commit dont le sujet commence par 🔒 est volontairement masqué
          # ici (ex. détails d'une faille de sécurité tant que le correctif
          # n'est pas confirmé en prod) : le reste des commits s'affiche
          # normalement, cette convention doit rester rare.
          COMMITS=$(jq -r '.commits[] | (.message | split("\n")[0]) as $subject |
            if ($subject | startswith("🔒")) then
              "• `\(.id[0:7])` **⚠️ À noter : non affiché ici pour raisons de sécurité** — \(.author.name)"
            else
              "• `\(.id[0:7])` \($subject) — \(.author.name)"
            end' "$GITHUB_EVENT_PATH")
          N=$(jq '.commits | length' "$GITHUB_EVENT_PATH")
          PAYLOAD=$(jq -n \
            --arg username "Github Update APP" \
            --arg avatar "https://clients.lklcloud.fr/logo.png" \
            --arg title "🚀 Push — ${PROJECT}" \
            --arg branch "$BRANCH" \
            --arg label "$LABEL" \
            --argjson color "$COLOR" \
            --arg commits "$COMMITS" \
            --arg countLabel "📝 Commits ($N)" \
            '{ username: $username, avatar_url: $avatar, embeds: [{ title: $title, color: $color, fields: [
              { name: "🌿 Branch", value: $label },
              { name: $countLabel, value: $commits }
            ] }] }')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
